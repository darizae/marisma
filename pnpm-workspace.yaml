packages:
  - 'packages/*'
  - 'apps/*'
  - 'apps/consumers/*'

# esbuild 0.28.2 is the single reviewed install script required by Vite and
# Storybook. Its postinstall selects the platform package, verifies its hash,
# and checks that the binary version matches the package version.
allowBuilds:
  esbuild: true

# Storybook's docgen plugin currently requests glob 13, whose entire range is
# advisory-affected. The patched glob 14 API is compatible with the plugin's
# narrow file-discovery use and is covered by the local Storybook gates.
overrides:
  glob: 14.0.2
