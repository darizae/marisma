name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-contract:
    name: Package contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Enable pnpm through Corepack
        run: corepack enable
      - name: Install accepted dependency graph
        run: pnpm install --frozen-lockfile
      - name: Build package
        run: pnpm build
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Verify packed package contract
        run: pnpm test:package-contract
